# Kestrel Shaders - shaders.properties
# Iris preprocesses this file with the option and environment macros, so #ifdef works here;
# #define and #include do not.

# ---------------------------------------------------------------- Rendering switches
# Kestrel draws its own sun, clouds and fog; vanilla overlays would double up.
clouds = off
sun = false
moon = true
oldLighting = false
oldHandLight = false
underwaterOverlay = false
vignette = false
frustum.culling = true
shadow.culling = true
particles.ordering = after

# Separate depth-compare samplers for shadows; per-block emission level attribute.
iris.features.optional = SEPARATE_HARDWARE_SAMPLERS BLOCK_EMISSION_ATTRIBUTE

texture.noise = textures/noise.png

# Half-resolution AO / light shafts / bloom atlas, and the 192x112 sky LUT.
size.buffer.colortex6 = 0.5 0.5
size.buffer.colortex7 = 192 112

# ---------------------------------------------------------------- Shadow casters
#ifdef ENTITY_SHADOWS
shadowEntities = true
shadowBlockEntities = true
shadowPlayer = true
#else
shadowEntities = false
shadowBlockEntities = false
shadowPlayer = false
#endif
#ifdef COLORED_SHADOWS
shadowTranslucent = true
#else
shadowTranslucent = false
#endif

# ---------------------------------------------------------------- Optional passes
# Each world folder is its own program set, so the paths carry the folder name.
program.world0/shadow.enabled = SHADOWS
program.world0/deferred.enabled = SSAO
program.world0/composite.enabled = VOLUMETRIC_LIGHT
program.world0/composite1.enabled = VOLUMETRIC_LIGHT
program.world0/composite2.enabled = TAA || FXAA || AUTO_EXPOSURE
program.world0/composite3.enabled = BLOOM

program.world-1/deferred.enabled = SSAO
program.world-1/composite2.enabled = TAA || FXAA || AUTO_EXPOSURE
program.world-1/composite3.enabled = BLOOM

program.world1/deferred.enabled = SSAO
program.world1/composite2.enabled = TAA || FXAA || AUTO_EXPOSURE
program.world1/composite3.enabled = BLOOM

# ---------------------------------------------------------------- Custom uniforms
# Biome factors fade over a few seconds when walking between biomes.
uniform.float.ksBiomeSwamp = smooth(if(biome_category == CAT_SWAMP, 1.0, 0.0), 40, 40)
uniform.float.ksBiomeDesert = smooth(if(in(biome_category, CAT_DESERT, CAT_MESA, CAT_SAVANNA), 1.0, 0.0), 40, 40)
uniform.float.ksBiomeSnowy = smooth(if(biome_precipitation == PPT_SNOW, 1.0, 0.0), 40, 40)
uniform.float.ksBiomeJungle = smooth(if(biome_category == CAT_JUNGLE, 1.0, 0.0), 40, 40)

# ---------------------------------------------------------------- Menu
screen = <profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [WATER] [CAMERA] [PERFORMANCE] <empty> [ADVANCED]
screen.columns = 2

screen.LIGHTING = PBR_MODE BLOCKLIGHT_TEMPERATURE HELD_LIGHT WETNESS PUDDLES <empty> SSAO AO_QUALITY ambientOcclusionLevel <empty> WAVING_FOLIAGE WIND_STRENGTH
screen.SHADOWS = SHADOWS shadowMapResolution shadowDistance SHADOW_FILTER COLORED_SHADOWS ENTITY_SHADOWS CLOUD_SHADOWS sunPathRotation
screen.ATMOSPHERE = ATMOSPHERE_STEPS ATMOSPHERE_DENSITY FOG_DENSITY CLOUD_LAYERS <empty> <empty> VOLUMETRIC_LIGHT VL_MODE VL_STEPS
screen.WATER = WATER_ADVANCED WATER_WAVE_OCTAVES WAVING_WATER CAUSTICS SSR_STEPS SSR_OPAQUE
screen.CAMERA = TONEMAP AUTO_EXPOSURE EXPOSURE_BIAS WHITE_BALANCE_K SATURATION CONTRAST <empty> <empty> BLOOM BLOOM_LEVELS BLOOM_STRENGTH VIGNETTE FILM_GRAIN <empty> PURKINJE PURKINJE_STRENGTH
screen.PERFORMANCE = TAA FXAA RENDER_SCALE_MODE RENDER_SCALE AUTO_TARGET_HEIGHT CAS_STRENGTH
screen.ADVANCED = MAC_ALLOW_HEAVY DEBUG_VIEW

sliders = shadowMapResolution shadowDistance sunPathRotation ambientOcclusionLevel RENDER_SCALE AUTO_TARGET_HEIGHT CAS_STRENGTH BLOOM_STRENGTH EXPOSURE_BIAS SATURATION CONTRAST WHITE_BALANCE_K VIGNETTE FILM_GRAIN PURKINJE_STRENGTH VL_STEPS SSR_STEPS WIND_STRENGTH FOG_DENSITY ATMOSPHERE_DENSITY BLOCKLIGHT_TEMPERATURE

# ---------------------------------------------------------------- Profiles
# Every profile sets every profile-controlled option. The code defaults equal LOW.
profile.POTATO = !SHADOWS shadowMapResolution:1024 shadowDistance:64.0 SHADOW_FILTER:0 !COLORED_SHADOWS !ENTITY_SHADOWS !SSAO AO_QUALITY:1 ambientOcclusionLevel:1.0 !VOLUMETRIC_LIGHT VL_MODE:0 VL_STEPS:8 CLOUD_LAYERS:1 !CLOUD_SHADOWS !WATER_ADVANCED WATER_WAVE_OCTAVES:2 SSR_STEPS:8 !SSR_OPAQUE !CAUSTICS WETNESS !PUDDLES PBR_MODE:0 !TAA !FXAA RENDER_SCALE_MODE:0 AUTO_TARGET_HEIGHT:1080 RENDER_SCALE:1.00 BLOOM BLOOM_LEVELS:4 !AUTO_EXPOSURE ATMOSPHERE_STEPS:8 !HELD_LIGHT
profile.LOW = SHADOWS shadowMapResolution:1024 shadowDistance:64.0 SHADOW_FILTER:1 !COLORED_SHADOWS !ENTITY_SHADOWS SSAO AO_QUALITY:1 ambientOcclusionLevel:0.75 VOLUMETRIC_LIGHT VL_MODE:0 VL_STEPS:12 CLOUD_LAYERS:2 !CLOUD_SHADOWS WATER_ADVANCED WATER_WAVE_OCTAVES:3 SSR_STEPS:10 !SSR_OPAQUE !CAUSTICS WETNESS !PUDDLES PBR_MODE:1 TAA !FXAA RENDER_SCALE_MODE:1 AUTO_TARGET_HEIGHT:810 RENDER_SCALE:1.00 BLOOM BLOOM_LEVELS:5 AUTO_EXPOSURE ATMOSPHERE_STEPS:12 HELD_LIGHT
profile.MEDIUM = SHADOWS shadowMapResolution:1536 shadowDistance:96.0 SHADOW_FILTER:2 !COLORED_SHADOWS ENTITY_SHADOWS SSAO AO_QUALITY:2 ambientOcclusionLevel:0.5 VOLUMETRIC_LIGHT VL_MODE:1 VL_STEPS:6 CLOUD_LAYERS:2 CLOUD_SHADOWS WATER_ADVANCED WATER_WAVE_OCTAVES:4 SSR_STEPS:16 SSR_OPAQUE CAUSTICS WETNESS PUDDLES PBR_MODE:1 TAA !FXAA RENDER_SCALE_MODE:1 AUTO_TARGET_HEIGHT:1080 RENDER_SCALE:1.00 BLOOM BLOOM_LEVELS:6 AUTO_EXPOSURE ATMOSPHERE_STEPS:16 HELD_LIGHT
profile.HIGH = SHADOWS shadowMapResolution:2048 shadowDistance:128.0 SHADOW_FILTER:3 COLORED_SHADOWS ENTITY_SHADOWS SSAO AO_QUALITY:3 ambientOcclusionLevel:0.5 VOLUMETRIC_LIGHT VL_MODE:1 VL_STEPS:12 CLOUD_LAYERS:2 CLOUD_SHADOWS WATER_ADVANCED WATER_WAVE_OCTAVES:5 SSR_STEPS:24 SSR_OPAQUE CAUSTICS WETNESS PUDDLES PBR_MODE:1 TAA !FXAA RENDER_SCALE_MODE:0 AUTO_TARGET_HEIGHT:1080 RENDER_SCALE:1.00 BLOOM BLOOM_LEVELS:6 AUTO_EXPOSURE ATMOSPHERE_STEPS:16 HELD_LIGHT
